
<!DOCTYPE html>
<html>
<head>
    <title>Cardiovascular Disease Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 65%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #123c69;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #205493;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cardiovascular Disease Prediction</h1>

    <p>Enter Patient Details for Prediction</p>

    <form action="/predict/" method="POST">

        {% csrf_token %}

        <label>Age</label>
        <input type="number" name="age" min="1" max="120" required>

        <label>Sex</label>
        <select name="sex" required>
            <option value="">Select Sex</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>

        <label>Chest Pain Type</label>
        <select name="chest_pain" required>
            <option value="">Select Chest Pain Type</option>
            <option value="TA">Typical Angina</option>
            <option value="ATA">Atypical Angina</option>
            <option value="NAP">Non-Anginal Pain</option>
            <option value="ASY">Asymptomatic</option>
        </select>

        <label>Resting Blood Pressure</label>
        <input type="number" name="resting_bp" min="1" required>

        <label>Cholesterol</label>
        <input type="number" name="cholesterol" min="0" required>

        <label>Fasting Blood Sugar</label>
        <select name="fasting_bs" required>
            <option value="">Select</option>
            <option value="0">Less than or equal to 120 mg/dl</option>
            <option value="1">Greater than 120 mg/dl</option>
        </select>

        <label>Resting ECG</label>
        <select name="resting_ecg" required>
            <option value="">Select ECG</option>
            <option value="Normal">Normal</option>
            <option value="ST">ST</option>
            <option value="LVH">Left Ventricular Hypertrophy</option>
        </select>

        <label>Maximum Heart Rate</label>
        <input type="number" name="max_hr" min="1" required>

        <label>Exercise-Induced Angina</label>
        <select name="exercise_angina" required>
            <option value="">Select</option>
            <option value="Y">Yes</option>
            <option value="N">No</option>
        </select>

        <label>Oldpeak</label>
        <input type="number" name="oldpeak" step="any" required>

        <label>ST Slope</label>
        <select name="st_slope" required>
            <option value="">Select ST Slope</option>
            <option value="Up">Up</option>
            <option value="Flat">Flat</option>
            <option value="Down">Down</option>
        </select>

        <button type="submit">Predict</button>

    </form>

</div>

</body>
</html>
